
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d1117">
<title>World Clock | AC1DST4R</title>

<style>
:root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel-hover: #1c232d;
    --border: #30363d;
    --text: #f0f6fc;
    --muted: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --red: #f85149;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 sans-serif;
    min-height: 100vh;
}

header {
    padding: 30px 7%;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
}

.logo {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -1px;
}

.logo span {
    color: var(--accent);
}

.header-right {
    color: var(--muted);
    font-size: 13px;
}

main {
    max-width: 1400px;
    padding: 40px 7%;
    margin: auto;
}

.hero {
    margin-bottom: 35px;
}

.hero h1 {
    font-size: clamp(30px, 5vw, 48px);
    letter-spacing: -2px;
    margin-bottom: 10px;
}

.hero p {
    color: var(--muted);
    line-height: 1.6;
}

.controls {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 25px;
}

input, select, button {
    font: inherit;
}

input, select {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 13px 15px;
    outline: none;
}

input:focus, select:focus {
    border-color: var(--accent);
}

#citySearch {
    flex: 1;
    min-width: 220px;
}

button {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 12px 17px;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    background: var(--panel-hover);
    border-color: var(--accent);
}

button.primary {
    background: var(--accent);
    color: #07111e;
    border-color: var(--accent);
    font-weight: 700;
}

button.primary:hover {
    background: #79b8ff;
}

button.danger:hover {
    border-color: var(--red);
    color: var(--red);
}

.settings {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 25px;
}

.settings label {
    color: var(--muted);
    font-size: 13px;
}

.settings select {
    margin-left: 8px;
    padding: 9px 12px;
}

.status {
    font-size: 13px;
    color: var(--muted);
    margin: 15px 0;
    min-height: 20px;
}

.status.error {
    color: var(--red);
}

.section-title {
    font-size: 18px;
    font-weight: 700;
    margin: 35px 0 15px;
}

.clock-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 15px;
}

.clock-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 22px;
    transition: 0.2s;
    position: relative;
    overflow: hidden;
}

.clock-card:hover {
    border-color: #484f58;
    transform: translateY(-2px);
}

.clock-card.local {
    border-color: #238636;
}

.card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
}

.city {
    font-size: 16px;
    font-weight: 700;
    overflow-wrap: anywhere;
}

.zone {
    color: var(--muted);
    font-size: 12px;
    margin-top: 5px;
}

.local-badge {
    color: var(--green);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1px;
}

.time {
    font-size: clamp(28px, 4vw, 38px);
    font-weight: 700;
    letter-spacing: -1.5px;
    font-variant-numeric: tabular-nums;
}

.date {
    color: var(--muted);
    font-size: 12px;
    margin-top: 8px;
}

.offset {
    display: inline-block;
    margin-top: 12px;
    padding: 5px 8px;
    border-radius: 5px;
    background: #21262d;
    color: var(--accent);
    font-size: 11px;
}

.remove {
    position: absolute;
    top: 12px;
    right: 12px;
    border: none;
    background: transparent;
    color: var(--muted);
    padding: 5px 8px;
    font-size: 16px;
}

.remove:hover {
    color: var(--red);
    border: none;
}

.empty {
    color: var(--muted);
    padding: 30px;
    text-align: center;
    border: 1px dashed var(--border);
    border-radius: 12px;
}

footer {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    padding: 35px 20px;
    border-top: 1px solid var(--border);
    margin-top: 60px;
}

footer a {
    color: var(--accent);
    text-decoration: none;
}

@media (max-width: 600px) {
    header {
        padding: 22px 5%;
    }

    main {
        padding: 30px 5%;
    }

    .controls button {
        flex: 1;
    }

    .clock-grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">WORLD<span>CLOCK</span></div>
    <div class="header-right" id="liveStatus">● Live</div>
</header>

<main>

    <section class="hero">
        <h1>Time, everywhere.</h1>
        <p>
            A real-time clock for the entire planet.
            Track cities, compare time zones, and find your local time.
        </p>
    </section>

    <div class="controls">
        <input
            id="citySearch"
            type="text"
            placeholder="Search a city or timezone..."
            autocomplete="off"
        >

        <button class="primary" id="searchBtn">
            + Add City
        </button>

        <button id="detectBtn">
            ◎ Detect Location
        </button>
    </div>

    <div class="settings">
        <label>
            Time format
            <select id="formatSelect">
                <option value="12">12-hour</option>
                <option value="24">24-hour</option>
            </select>
        </label>

        <label>
            Display
            <select id="displaySelect">
                <option value="both">Time + Date</option>
                <option value="time">Time only</option>
            </select>
        </label>
    </div>

    <div class="status" id="message"></div>

    <h2 class="section-title">Your Local Time</h2>
    <div class="clock-grid" id="localGrid"></div>

    <h2 class="section-title">Your World Clocks</h2>
    <div class="clock-grid" id="worldGrid"></div>

    <h2 class="section-title">All Time Zones</h2>

    <div class="controls">
        <input
            id="zoneSearch"
            type="text"
            placeholder="Filter all available time zones..."
        >
    </div>

    <div class="clock-grid" id="allGrid"></div>

</main>

<footer>
    <p>WORLD CLOCK · Powered by your browser's international time engine</p>
    <p style="margin-top:8px">
        <a href="https://ac1dst4r.github.io/">AC1DST4R</a>
    </p>
</footer>

<script>
const $ = id => document.getElementById(id);

const localGrid = $("localGrid");
const worldGrid = $("worldGrid");
const allGrid = $("allGrid");

let timeFormat = "12";
let displayMode = "both";

let localTimezone =
    Intl.DateTimeFormat().resolvedOptions().timeZone;

let localCity = "Your Location";

let clocks = [
    { city: "New York", zone: "America/New_York" },
    { city: "London", zone: "Europe/London" },
    { city: "Tokyo", zone: "Asia/Tokyo" },
    { city: "Sydney", zone: "Australia/Sydney" },
    { city: "Dubai", zone: "Asia/Dubai" },
    { city: "Los Angeles", zone: "America/Los_Angeles" },
    { city: "Paris", zone: "Europe/Paris" },
    { city: "Singapore", zone: "Asia/Singapore" }
];

const allZones = Intl.supportedValuesOf
    ? Intl.supportedValuesOf("timeZone")
    : [
        "UTC",
        "America/New_York",
        "America/Chicago",
        "America/Denver",
        "America/Los_Angeles",
        "Europe/London",
        "Europe/Paris",
        "Asia/Tokyo",
        "Asia/Shanghai",
        "Asia/Dubai",
        "Australia/Sydney"
    ];

function getTime(zone) {
    const now = new Date();

    const time = new Intl.DateTimeFormat("en-US", {
        timeZone: zone,
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: timeFormat === "12"
    }).format(now);

    const date = new Intl.DateTimeFormat("en-US", {
        timeZone: zone,
        weekday: "short",
        year: "numeric",
        month: "short",
        day: "numeric"
    }).format(now);

    const offset = new Intl.DateTimeFormat("en-US", {
        timeZone: zone,
        timeZoneName: "shortOffset"
    }).formatToParts(now)
      .find(part => part.type === "timeZoneName")?.value || "UTC";

    return { time, date, offset };
}

function makeCard(city, zone, isLocal = false, index = null) {
    const card = document.createElement("div");

    card.className = "clock-card" + (isLocal ? " local" : "");

    card.innerHTML = `
        <div class="card-top">
            <div>
                <div class="city"></div>
                <div class="zone"></div>
            </div>
            ${isLocal
                ? '<span class="local-badge">LOCAL</span>'
                : index !== null
                    ? `<button class="remove" title="Remove clock">×</button>`
                    : ""
            }
        </div>

        <div class="time"></div>
        <div class="date"></div>
        <div class="offset"></div>
    `;

    card.querySelector(".city").textContent = city;
    card.querySelector(".zone").textContent = zone;

    if (index !== null) {
        card.querySelector(".remove").onclick = () => {
            clocks.splice(index, 1);
            renderWorld();
        };
    }

    updateCard(card, zone);

    return card;
}

function updateCard(card, zone) {
    const data = getTime(zone);

    card.querySelector(".time").textContent = data.time;

    card.querySelector(".date").textContent =
        displayMode === "both" ? data.date : "";

    card.querySelector(".offset").textContent = data.offset;
}

function renderLocal() {
    localGrid.innerHTML = "";

    localGrid.appendChild(
        makeCard(localCity, localTimezone, true)
    );
}

function renderWorld() {
    worldGrid.innerHTML = "";

    if (!clocks.length) {
        worldGrid.innerHTML =
            '<div class="empty">No world clocks added yet.</div>';
        return;
    }

    clocks.forEach((clock, index) => {
        worldGrid.appendChild(
            makeCard(clock.city, clock.zone, false, index)
        );
    });
}

function renderAllZones(filter = "") {
    allGrid.innerHTML = "";

    const matching = allZones.filter(zone =>
        zone.toLowerCase().includes(filter.toLowerCase())
    );

    matching.forEach(zone => {
        const card = makeCard(
            zone.split("/").pop().replace(/_/g, " "),
            zone
        );

        allGrid.appendChild(card);
    });
}

function updateAllClocks() {
    document.querySelectorAll(".clock-card").forEach(card => {
        const zone = card.querySelector(".zone").textContent;
        updateCard(card, zone);
    });

    $("liveStatus").textContent =
        "● Live · " + new Date().toLocaleTimeString();
}

function addClock(city, zone) {
    if (!allZones.includes(zone) && zone !== "UTC") {
        showMessage("That time zone isn't supported.", true);
        return;
    }

    if (clocks.some(clock => clock.zone === zone)) {
        showMessage("That time zone is already on your dashboard.");
        return;
    }

    clocks.push({ city, zone });

    renderWorld();
    showMessage(city + " added to your world clocks.");
    $("citySearch").value = "";
}

function showMessage(message, error = false) {
    $("message").textContent = message;
    $("message").className = "status" + (error ? " error" : "");
}

async function searchCity() {
    const query = $("citySearch").value.trim();

    if (!query) {
        showMessage("Enter a city or time zone first.", true);
        return;
    }

    if (allZones.includes(query)) {
        addClock(query.split("/").pop().replace(/_/g, " "), query);
        return;
    }

    showMessage("Searching for " + query + "...");

    try {
        const response = await fetch(
            "https://geocoding-api.open-meteo.com/v1/search?name=" +
            encodeURIComponent(query) +
            "&count=10&language=en&format=json"
        );

        const data = await response.json();

        if (!data.results || !data.results.length) {
            showMessage("No matching cities found.", true);
            return;
        }

        const results = data.results.filter(place => place.timezone);

        if (!results.length) {
            showMessage("No supported time zones found.", true);
            return;
        }

        if (results.length === 1) {
            const place = results[0];
            addClock(
                place.name + (place.country ? ", " + place.country : ""),
                place.timezone
            );
            return;
        }

        showCityResults(results);

    } catch (error) {
        showMessage("City search failed. Check your internet connection.", true);
    }
}

function showCityResults(results) {
    const message = $("message");

    message.innerHTML = "";
    message.className = "status";

    const label = document.createElement("span");
    label.textContent = "Choose a matching location: ";
    message.appendChild(label);

    const select = document.createElement("select");
    select.style.marginLeft = "10px";
    select.style.maxWidth = "100%";

    results.forEach((place, index) => {
        const option = document.createElement("option");

        option.value = index;
        option.textContent =
            place.name +
            (place.admin1 ? ", " + place.admin1 : "") +
            (place.country ? ", " + place.country : "") +
            " · " + place.timezone;

        select.appendChild(option);
    });

    message.appendChild(select);

    const addButton = document.createElement("button");
    addButton.textContent = "Add";
    addButton.style.marginLeft = "10px";

    addButton.onclick = () => {
        const place = results[select.value];

        addClock(
            place.name + (place.country ? ", " + place.country : ""),
            place.timezone
        );
    };

    message.appendChild(addButton);
}

async function detectLocation() {
    if (!navigator.geolocation) {
        showMessage("Geolocation is not supported by this browser.", true);
        return;
    }

    showMessage("Requesting location permission...");

    navigator.geolocation.getCurrentPosition(
        async position => {
            const { latitude, longitude } = position.coords;

            try {
                const response = await fetch(
                    "https://timeapi.io/api/TimeZone/coordinate?latitude=" +
                    latitude + "&longitude=" + longitude
                );

                if (!response.ok) throw new Error("Timezone lookup failed");

                const data = await response.json();

                if (!allZones.includes(data.timeZone)) {
                    throw new Error("Unsupported time zone");
                }

                localTimezone = data.timeZone;

                try {
                    const reverse = await fetch(
                        "https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=" +
                        latitude + "&lon=" + longitude
                    );

                    const place = await reverse.json();

                    localCity =
                        place.address.city ||
                        place.address.town ||
                        place.address.village ||
                        place.address.county ||
                        "Your Location";

                } catch {
                    localCity = "Your Location";
                }

                renderLocal();

                showMessage(
                    "Location detected: " + localCity +
                    " · " + localTimezone
                );

            } catch (error) {
                showMessage(
                    "Couldn't determine your time zone. " +
                    "Your browser's local time zone is still available.",
                    true
                );
            }
        },

        error => {
            const messages = {
                1: "Location permission denied. You can search manually.",
                2: "Your location could not be determined.",
                3: "Location request timed out."
            };

            showMessage(messages[error.code] || "Location detection failed.", true);
        },

        {
            enableHighAccuracy: false,
            timeout: 15000,
            maximumAge: 300000
        }
    );
}

$("searchBtn").addEventListener("click", searchCity);

$("citySearch").addEventListener("keydown", event => {
    if (event.key === "Enter") searchCity();
});

$("detectBtn").addEventListener("click", detectLocation);

$("formatSelect").addEventListener("change", event => {
    timeFormat = event.target.value;
    updateAllClocks();
});

$("displaySelect").addEventListener("change", event => {
    displayMode = event.target.value;
    updateAllClocks();
});

$("zoneSearch").addEventListener("input", event => {
    renderAllZones(event.target.value);
});

renderLocal();
renderWorld();
renderAllZones();

setInterval(updateAllClocks, 1000);
</script>

</body>
</html>
